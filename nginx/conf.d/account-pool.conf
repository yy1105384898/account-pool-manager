proxy_cache_path /var/cache/nginx/account-pool levels=1:2 keys_zone=account_pool_static:32m max_size=512m inactive=7d use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream account_pool_app {
  server account-pool-manager:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location ^~ /_next/static/ {
    proxy_pass http://account_pool_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    proxy_cache account_pool_static;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_valid 200 301 302 30d;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
    proxy_pass http://account_pool_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    proxy_cache account_pool_static;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_valid 200 301 302 7d;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass http://account_pool_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;
    proxy_cache off;

    add_header Cache-Control "no-store" always;
    add_header X-Proxy-Cache "BYPASS" always;
  }

  location / {
    proxy_pass http://account_pool_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;
    proxy_cache off;

    add_header Cache-Control "no-store" always;
    add_header X-Proxy-Cache "BYPASS" always;
  }
}
