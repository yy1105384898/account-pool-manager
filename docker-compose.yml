services:
  account-pool-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account-pool-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_PASSWORD: "Proliant*12"
      ADMIN_SESSION_TOKEN: "account-pool-admin-Proliant12"
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  account-pool-proxy:
    image: nginx:1.27-alpine
    container_name: account-pool-proxy
    restart: unless-stopped
    depends_on:
      account-pool-manager:
        condition: service_healthy
    ports:
      - "3015:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nginx-cache:
